[package]
name = "kalshi-api"
version = "3.34.0"
edition = "2021"
license = "MIT"
description = "Hand-written client for the Kalshi Trade API"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
futures-util = "0.3"
http = "1"
kalshi-api-openapi = { version = "3.34.0", path = "../kalshi-api-openapi", default-features = false, features = ["rustls-tls"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-middleware = "0.4"
rsa = { version = "0.9", features = ["sha2", "pem"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "test-util"] }

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
