[package]
name = "kalshi-api-openapi"
version = "3.34.0"
authors = ["wangschien <schienwang@gmail.com>"]
description = "Rust models and client generated from the official Kalshi OpenAPI"
# Override this license by providing a License Object in the OpenAPI.
license = "MIT"
edition = "2021"

repository = "https://github.com/wangschien/kalshi-api-rust"
homepage = "https://github.com/wangschien/kalshi-api-rust"
readme = "README.md"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = { version = "^1.0", features = ["arbitrary_precision"] }
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
reqwest = { version = "^0.12", default-features = false, features = ["json", "multipart"] }
reqwest-middleware = { version = "^0.4", features = ["json", "multipart"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]
